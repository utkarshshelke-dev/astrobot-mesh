[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
markers =
    unit: Deterministic unit tests (TDD layer)
    integration: Tests that hit BigQuery (slow)
    eval: LLM eval tests (non-deterministic, 28-question suite)